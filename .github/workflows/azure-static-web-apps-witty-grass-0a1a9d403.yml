name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      # Google Analytics 4 measurement ID. Set as a repository *variable*
      # (Settings > Secrets and variables > Actions > Variables), never
      # committed: this repo is public and the value differs per environment.
      # When the variable is unset the build ships with no analytics and no
      # consent banner, which is the correct behaviour for forks.
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check logo provenance
        run: npm run check-logo-provenance
      - name: Check logo audit report sync
        run: npm run check-logo-audit-report
      - name: Check color literals (palette is single-sourced)
        run: npm run check-color-literals
      - name: Lint
        run: npm run lint
      - name: Check governance data
        run: npm run check-governance-data
      - name: Check updates data
        run: npm run check-updates-data
      - name: Check tool-card data
        run: npm run check-tool-card-data
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Check generated SEO artifacts
        run: npm run check-generated-artifacts
      - name: Check open-data artifacts
        run: npm run check-open-data
      - name: Check SEO readiness
        run: npm run check-seo-readiness
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_GRASS_0A1A9D403 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "out"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request Preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_GRASS_0A1A9D403 }}
          action: "close"
